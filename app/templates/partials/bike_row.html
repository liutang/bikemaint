{% import "partials/icons.html" as ui_icons %}
<article class="card bike-card" id="bike-{{ bike.id }}">
  <header class="bike-card-head">
    <span class="bike-card-icon">{{ ui_icons.bike() }}</span>
    <div>
      <h3><a href="/bikes/{{ bike.id }}">{{ bike.name }}</a></h3>
      <span class="chip">{{ bike.bike_type or "bike" }}</span>
    </div>
  </header>
  <p class="bike-card-figure"><span class="bike-card-stat"><strong>{{ "%.1f"|format(bike.total_mileage) }} mi</strong><small>total mileage</small></span></p>
  <div class="bike-card-actions">
    <a class="btn btn-primary" href="/bikes/{{ bike.id }}">View</a>
    <a class="btn btn-quiet" href="/components/new?parent_bike_id={{ bike.id }}">Add component</a>
    <a class="btn btn-quiet" href="/bikes/{{ bike.id }}/maintenance">Maintenance history</a>
  </div>
</article>
