[project]
name = "bikemaint"
version = "0.1.0"
description = "Single-user, self-hosted bike maintenance tracker with Strava mileage sync"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "httpx",
    "apscheduler",
    "itsdangerous",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "respx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
